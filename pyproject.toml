[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparql-kata"
version = "0.1.0"
description = "Grade SPARQL exercises by comparing query results, with hints for common mistakes."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "rdflib>=7.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sparql-kata = "sparql_kata.cli:main"

[tool.setuptools.packages.find]
include = ["sparql_kata*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
